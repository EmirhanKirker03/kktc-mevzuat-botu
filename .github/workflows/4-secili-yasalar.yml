name: 4 - Seçili yasalar (hızlı)
on:
  workflow_dispatch:
    inputs:
      pkeyler:
        description: "Mahkemeler sistemindeki yasa kayıt numaraları, virgülle (ör. 24,304)"
        required: true
permissions:
  contents: write
concurrency:
  group: secili
  cancel-in-progress: false
jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/mahkemeler.js secili yasa "${{ inputs.pkeyler }}"
        env:
          HAM_DIR: ${{ runner.temp }}/ham
      - name: Orijinal dosyaları ayrı dala koy (ana dal temiz kalır)
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/ham" ] && [ "$(ls -A $RUNNER_TEMP/ham)" ] || exit 0
          git config --global user.name "mevzuat-botu"
          git config --global user.email "mevzuat-botu@users.noreply.github.com"
          if git fetch -q origin orijinaller; then git worktree add -q -B orijinaller ../o origin/orijinaller; else git worktree add -q --orphan -b orijinaller ../o; fi
          mkdir -p ../o/yasalar && cp "$RUNNER_TEMP"/ham/* ../o/yasalar/
          cd ../o && git add -A && (git commit -qm "Orijinal dosyalar: ${{ inputs.pkeyler }}" || true) && git push -q origin orijinaller
      - name: Sonuçları kaydet
        if: always()
        run: |
          git config user.name "mevzuat-botu"
          git config user.email "mevzuat-botu@users.noreply.github.com"
          git add veri/mahkemeler/secili veri/mahkemeler/secili-yasa-kayit.json
          git commit -m "Seçili yasalar: ${{ inputs.pkeyler }}" || echo "Değişiklik yok"
          git pull --rebase
          git push
