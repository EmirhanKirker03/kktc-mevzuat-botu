name: 6 - Değişen yasa/tüzük denetimi
# Mahkemeler sitesindeki dosyaları yeniden indirip parmak izini karşılaştırır; yalnızca değişenlerin metnini yeniler
# (Word ise LibreOffice ile de). Taranmış dosya değiştiyse iş akışı 5 (ocr) ayrıca çalıştırılmalı. Rapor: sonuc/degisim-<tur>.json
on:
  workflow_dispatch:
    inputs:
      tur:
        description: "yasa (~1,5 saat) ya da tuzuk (~3,5 saat)"
        type: choice
        options: ["yasa", "tuzuk"]
        default: "yasa"
  schedule:
    - cron: "17 2 1 * *"   # her ayın 1'i (yalnızca yasalar)
permissions:
  contents: write
concurrency:
  group: mahkemeler
  cancel-in-progress: false
jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-writer
      - run: npm install --no-audit --no-fund
      - name: Listeyi güncelle
        run: node scripts/mahkemeler.js liste
      - name: Değişenleri bul ve yenile
        run: node scripts/degisim.js "${{ inputs.tur || 'yasa' }}"
      - name: Değişen Word dosyalarını LibreOffice ile yeniden çıkar
        if: always()
        run: node scripts/onarim.js lo "${{ inputs.tur || 'yasa' }}"
      - name: Sonuçları kaydet
        if: always()
        run: |
          git config user.name "mevzuat-botu"
          git config user.email "mevzuat-botu@users.noreply.github.com"
          git add liste veri sonuc
          git commit -qm "Değişim denetimi: ${{ inputs.tur || 'yasa' }}" || echo "Değişiklik yok"
          for i in 1 2 3 4 5 6; do git pull -q --rebase && git push -q && break; sleep $((i*10)); done
