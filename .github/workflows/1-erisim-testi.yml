name: 1 - Erişim testi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/erisim-testi.js
      - name: Sonucu kaydet
        run: |
          git config user.name "mevzuat-botu"
          git config user.email "mevzuat-botu@users.noreply.github.com"
          git add sonuc
          git commit -m "Erişim testi sonucu" || echo "Değişiklik yok"
          git push
